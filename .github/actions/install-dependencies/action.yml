name: 'Install Dependencies'
description: 'Install Eigen, Boost and other dependencies required by vinecopulib'
inputs:
  os:
    description: 'The operating system to install dependencies for'
    required: false
    default: 'ubuntu-latest'
  platform:
    description: 'The platform to install dependencies for'
    required: false
    default: 'x64'
  boost:
    description: 'Whether to install Boost'
    required: false
    default: 'true'
  boost_install_dir:
    description: 'The directory to install Boost to'
    required: false
    default: '/home/runner/work'
  boost_version:
    description: 'The version of Boost to install'
    required: false
    default: '1.84.0'
  eigen:
    description: 'Whether to install Eigen'
    required: false
    default: 'true'
  eigen_install_dir:
    description: 'The directory to install Eigen to'
    required: false
    default: '/home/runner/work'
  eigen_version:
    description: 'The version of Eigen to install'
    required: false
    default: '3.4.0'
  wdm:
    description: 'Whether to install wdm'
    required: false
    default: 'true'
  wdm_ref:
    description: >
      The wdm commit or tag to install. Keep in sync with the FetchContent
      GIT_TAG in cmake/findDependencies.cmake.
    required: false
    default: 'v0.3.0'
  lcov:
    description: 'Whether to install lcov'
    required: false
    default: 'true'
  R:
    description: 'Whether to install R'
    required: false
    default: 'false'
  update_compilers_ubuntu:
    description: 'Whether to update the compilers on Ubuntu'
    required: false
    default: 'true'
outputs:
  BOOST_ROOT:
    description: 'The path to the boost installation, e.g. to be used in CMake'
    value: ${{ steps.boost.outputs.BOOST_ROOT }}
  EIGEN3_ROOT:
    description: 'The path to the eigen installation, e.g. to be used in CMake'
    value: ${{ inputs.eigen_install_dir }}/eigen
  # No WDM_ROOT: wdm installs to the system prefix and is found via find_package.
runs:
  using: 'composite'
  steps:

    - name: Update compilers on ubuntu
      if: inputs.update_compilers_ubuntu == 'true'
      run: |
          if [ "${{ inputs.os }}" == "ubuntu-latest" ]; then
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ clang
          sudo apt-get autoremove
          fi
      shell: bash

    - name: Install boost ${{inputs.boost_version}}
      if: inputs.boost == 'true'
      id: boost
      uses: MarkusJx/install-boost@6d8df42f57de83c5b326b5b83e7b35d650030103
      with:
          boost_version: ${{inputs.boost_version}}
          boost_install_dir: ${{ inputs.boost_install_dir }}

    - name: Install Eigen ${{inputs.eigen_version}}
      if: inputs.eigen == 'true'
      run: |
          # Both sources fail intermittently: gitlab.com returns 503, and the
          # Chocolatey eigen package periodically fails to unpack.
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $attempt failed; retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            return 1
          }
          # A relative destination: runner.temp is a backslash path on Windows,
          # which bash mangles.
          clone_eigen() {
            # git clone refuses a non-empty destination, so start clean.
            rm -rf eigen-src
            git clone --depth 1 --branch ${{inputs.eigen_version}} \
              https://gitlab.com/libeigen/eigen.git/ eigen-src
          }
          # Same source everywhere. Eigen is header-only, and the Chocolatey
          # package is unreliable, so Windows builds it from the clone too; the
          # install provides the Eigen3Config.cmake that find_package needs.
          prefix=$(echo '${{ inputs.eigen_install_dir }}' | tr '\\' '/')
          retry clone_eigen
          cmake -S eigen-src -B eigen-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_TESTING=OFF
          cmake --build eigen-src/build --config Release --target install
      shell: bash

    - name: Install wdm (pinned to ${{inputs.wdm_ref}})
      if: inputs.wdm == 'true'
      run: |
          # Relative path: ${{runner.temp}} is a backslash path on Windows,
          # which bash mangles.
          git clone https://github.com/tnagler/wdm.git wdm
          cd wdm
          git checkout --detach ${{ inputs.wdm_ref }}
          mkdir release && cd release
          if [ "${{ inputs.os }}" != "windows-latest" ]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release
            sudo make install
          else
            cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build . --target install
          fi
          cd ../.. && rm -rf wdm
      shell: bash

    - name: Install lcov
      if: inputs.lcov == 'true'
      run: |
          if [ "${{ inputs.os }}" == "ubuntu-latest" ]; then
              sudo apt-get install --no-install-recommends -y lcov
          fi
      shell: bash

    - name: Install R
      if: inputs.R == 'true'
      uses: r-lib/actions/setup-r@v2

    - name: Install VineCopula
      if: inputs.R == 'true'
      env:
        # authenticate the GitHub API call so install_github does not fall back
        # to the rate-limited bundled PAT (mirrors the job-level GITHUB_PAT;
        # set here too so the action stays self-contained)
        GITHUB_PAT: ${{ github.token }}
      run: |
        # GSL is needed when VineCopula compiles from source. Match any macOS
        # runner, not the exact label.
        case "${{ inputs.os }}" in
          ubuntu-*) sudo apt-get install --no-install-recommends -y libgsl0-dev ;;
          macos-*)  brew install gsl ;;
        esac
        # Install the CRAN release first (pulls in every dependency as a
        # binary), then upgrade VineCopula itself to the GitHub version: 2.6.2
        # is required by the derivative parity tests (RVineGrad / RVineHessian
        # rotation + sample-size fixes, tnagler/VineCopula #101, #102) but is
        # not on CRAN yet, so only VineCopula compiles from source.
        Rscript -e "install.packages(c('VineCopula', 'remotes'), repos='https://cloud.r-project.org')"
        Rscript -e "remotes::install_github('tnagler/VineCopula', upgrade = 'never')"
      shell: bash
