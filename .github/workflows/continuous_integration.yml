name: Build Status

on:
  push:
    branches: [main]
    tags: ['v*']
  # No branch filter: stacked pull requests target the branch below them, and
  # they need the matrix as much as the ones targeting main.
  pull_request:
  workflow_dispatch:
  # release.yml re-runs the matrix against the tag before publishing.
  workflow_call:

# One run per ref; supersede in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BOOST_VERSION: 1.84.0
  EIGEN_VERSION: 3.4.0
  CLANG_FORMAT_VERSION: 14.0.6
  CODESPELL_VERSION: 2.4.3

jobs:
  style:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # From PyPI, not apt: pins the exact binary so local runs match CI.
      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pipx install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"

      - name: Check formatting
        run: |
          # Skip the vendored JSON header and the generated Sobol table.
          git ls-files -z '*.h' '*.hpp' '*.ipp' '*.cpp' '*.cc' \
            | grep -zv '^include/vinecopulib/misc/nlohmann_json\.hpp$' \
            | grep -zv '^include/vinecopulib/misc/tools_stats_sobol\.hpp$' \
            | xargs -0 clang-format --dry-run --Werror

  spelling:
    name: codespell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # From PyPI, not apt: pins the exact binary so local runs match CI. Keep
      # in sync with the `rev` in .pre-commit-config.yaml.
      - name: Install codespell ${{ env.CODESPELL_VERSION }}
        run: pipx install "codespell==${{ env.CODESPELL_VERSION }}"

      - name: Check spelling and prose
        run: |
          # Tracked files only: the build steps clone eigen-src and wdm into
          # the workspace, and a skip list cannot anticipate every directory a
          # build step drops there. Exclusions live in .codespellrc.
          git ls-files -z | xargs -0 codespell

  version:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check that the version agrees everywhere it is stated
        run: python3 scripts/check_version.py

  build:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cfg:
          - { os: ubuntu-latest,  name: GNU,   cc: gcc,   cxx: g++,     platform: x64,   root_install_dir: '/home/runner/work' }
          - { os: ubuntu-latest,  name: Clang, cc: clang, cxx: clang++, platform: x64,   root_install_dir: '/home/runner/work' }
          - { os: macos-15-intel, name: Clang, cc: clang, cxx: clang++, platform: x64,   root_install_dir: '/Users/runner/work' } # intel runner
          - { os: macos-15,       name: Clang, cc: clang, cxx: clang++, platform: arm64, root_install_dir: '/Users/runner/work' } # apple silicon runner
          - { os: windows-latest, name: x32,   cc: cl,    cxx: cl,      platform: x32,   root_install_dir: 'D:\' }
          - { os: windows-latest, name: x64,   cc: cl,    cxx: cl,      platform: x64,   root_install_dir: 'D:\' }
    env:
      # Authenticate remotes::install_github against the GitHub API using the
      # automatic Actions token instead of the rate-limited bundled PAT (the
      # VineCopula >= 2.6.2 install, and any test-time fallback, need it).
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Lifted to the job so the coverage step can test for it: Dependabot and
      # fork pull requests do not receive repository secrets.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    runs-on: ${{ matrix.cfg.os }}
    name: ${{ matrix.cfg.os }} (${{ matrix.cfg.name }}, ${{ matrix.cfg.platform }})
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Set up MSVC environment
        if: matrix.cfg.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.cfg.platform == 'x32' && 'x86' || matrix.cfg.platform }}
      - name: Install dependencies
        id: install-dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ${{ matrix.cfg.os }}
          platform: ${{ matrix.cfg.platform }}
          boost_install_dir: ${{ matrix.cfg.root_install_dir }}
          eigen_install_dir: ${{ matrix.cfg.root_install_dir }}
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          R: true
      - name: Set environment variables and path
        run: |
          echo "CC=${{ matrix.cfg.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cfg.cxx }}" >> $GITHUB_ENV
          echo "BOOST_ROOT=${{ steps.install-dependencies.outputs.BOOST_ROOT }}" >> $GITHUB_ENV
          if [ "${{ matrix.cfg.os }}" == "windows-latest" ]; then
            # Linux and macOS runners ship an Eigen that find_package locates on
            # its own; Windows does not, so point it at the one we installed.
            # CMP0074 makes find_package honor <Package>_ROOT from the
            # environment.
            echo "Eigen3_ROOT=D:/" >> $GITHUB_ENV
            echo "D:\a\vinecopulib\vinecopulib\debug" >> $GITHUB_PATH
            echo "D:\a\vinecopulib\vinecopulib\release" >> $GITHUB_PATH
            echo "D:\a\vinecopulib\vinecopulib\release\Release" >> $GITHUB_PATH
          fi
        shell: bash
      - name: Compile the debug version
        run: |
          mkdir debug && cd debug
          if [ "${{ matrix.cfg.os }}" != "windows-latest" ]; then
            if [ "${{ matrix.cfg.os }}/${{ matrix.cfg.name }}" == "ubuntu-latest/GNU" ]; then
              cmake .. -DVINECOPULIB_STRICT_COMPILER=ON \
                -DVINECOPULIB_CODE_COVERAGE=ON \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
              make vinecopulib_coverage
            else
              cmake .. -DCMAKE_BUILD_TYPE=Debug
              make
            fi
          else
            cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Debug
            cmake --build .
          fi
        shell: bash
      # Debug enables -fsanitize=address,undefined, so these tests must run.
      # Use test_all, not ctest: the R-parity fixtures share fixed temp file
      # names, so they cannot run concurrently.
      - name: Run the debug tests
        if: matrix.cfg.os != 'ubuntu-latest' || matrix.cfg.name != 'GNU'
        run: |
          cd debug
          if [ "${{ matrix.cfg.os }}" != "windows-latest" ]; then bin/test_all; else bin/test_all.exe; fi
        shell: bash
      # gtest_discover_tests registers a `_NOT_BUILT` placeholder on failure.
      - name: Check that ctest discovery works
        if: matrix.cfg.os != 'windows-latest'
        run: |
          cd debug
          n=$(ctest -N | sed -n 's/^Total Tests: //p')
          echo "ctest discovered $n test(s)"
          if [ "${n:-0}" -lt 100 ]; then
            echo "::error::ctest discovered only ${n:-0} tests; gtest_discover_tests is broken"
            exit 1
          fi
        shell: bash
      # Skipped without a token rather than failing: Codecov rejects tokenless
      # uploads to a protected branch, and Dependabot and fork pull requests get
      # no secrets. When the token is present the upload must succeed.
      - name: Code coverage
        uses: codecov/codecov-action@v7
        if: >
          contains(matrix.cfg.os, 'ubuntu') && contains(matrix.cfg.name, 'GNU')
          && env.CODECOV_TOKEN != ''
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: debug/coverage.info
          disable_search: true
          fail_ci_if_error: true
      - name: Compile, test and install the precompiled release version
        run: |
          mkdir release && cd release
          if [ "${{ matrix.cfg.os }}" != "windows-latest" ]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release -DVINECOPULIB_PRECOMPILED=ON
            make
            bin/test_all
            sudo make install
          else
            cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DVINECOPULIB_PRECOMPILED=ON
            cmake --build .
            bin/test_all.exe
            cmake --build . --target install
          fi
        shell: bash
      - name: Check that an edited .ipp regenerates its translation unit
        run: |
          probe=include/vinecopulib/bicop/implementation/abstract.ipp
          printf '\n// regeneration probe\n' >> "$probe"
          cmake --build release --target vinecopulib
          grep -q "regeneration probe" release/generated/src/bicop/abstract.cpp
          git checkout -- "$probe"
        shell: bash
      - name: Test the install (bicop and vinecop examples)
        run: |
          for ex in bicop vinecop; do
            ( cd "examples/$ex" && mkdir build && cd build
              if [ "${{ matrix.cfg.os }}" != "windows-latest" ]; then
                cmake .. && make && ../bin/main
              else
                cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
                cmake --build .
                ../bin/main.exe
              fi )
          done
        shell: bash

  # The default configuration: .hpp + .ipp install, as consumed by the R and
  # Python wrappers. The matrix above only covers VINECOPULIB_PRECOMPILED=ON.
  header-only-install:
    name: header-only install (ubuntu, GNU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        id: install-dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu-latest
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          eigen_install_dir: ${{ runner.temp }}/eigen
          R: true
      - name: Set environment variables
        run: |
          echo "BOOST_ROOT=${{ steps.install-dependencies.outputs.BOOST_ROOT }}" >> $GITHUB_ENV
          echo "Eigen3_ROOT=${{ runner.temp }}/eigen" >> $GITHUB_ENV
      - name: Configure, build, test and install (header-only)
        run: |
          mkdir release && cd release
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make
          bin/test_all
          sudo make install
      - name: Verify the .ipp tree was installed
        run: |
          test -f /usr/local/include/vinecopulib/bicop/implementation/class.ipp \
            || { echo "header-only install did not ship the .ipp tree"; exit 1; }
      - name: Link the examples against the header-only install
        run: |
          for ex in bicop vinecop; do
            ( cd "examples/$ex" && mkdir build && cd build && cmake .. && make && ../bin/main )
          done
      # CMAKE_DISABLE_FIND_PACKAGE_* makes the consumer unable to find the
      # dependencies, so the paths recorded in the package have to serve.
      - name: Consume an install configured with dependency paths
        run: |
          cmake -S . -B build-prefix \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix" \
            -DEIGEN3_INCLUDE_DIR="$RUNNER_TEMP/eigen/include/eigen3" \
            -DBoost_INCLUDE_DIRS="$BOOST_ROOT/include" \
            -Dwdm_INCLUDE_DIRS=/usr/local/include
          cmake --install build-prefix
          # without the build tree and binary the step above left behind
          cp -a examples/bicop "$RUNNER_TEMP/consumer"
          rm -rf "$RUNNER_TEMP/consumer/build" "$RUNNER_TEMP/consumer/bin"
          cmake -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/build" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Boost=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_wdm=ON
          cmake --build "$RUNNER_TEMP/consumer/build" -j"$(nproc)"
          "$RUNNER_TEMP/consumer/bin/main" > /dev/null

  # Two configure-time defects the matrix cannot reach; nothing is compiled.
  configure-checks:
    name: cmake configure checks (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        id: install-dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu-latest
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          eigen_install_dir: ${{ runner.temp }}/eigen
          R: false
          lcov: false
      # The second step configures the way an ordinary build does.
      - name: Set environment variables
        run: |
          echo "BOOST_ROOT=${{ steps.install-dependencies.outputs.BOOST_ROOT }}" >> $GITHUB_ENV
          echo "Eigen3_ROOT=${{ runner.temp }}/eigen" >> $GITHUB_ENV
      # A missing namespaced target fails generation, but the plain name wdm
      # would only fail at link time, so check the generated link line too.
      - name: Configure with caller-supplied dependency paths
        run: |
          # Assert the layout, so a change to it fails as itself.
          eigen_inc="${{ runner.temp }}/eigen/include/eigen3"
          boost_inc="$BOOST_ROOT/include"
          test -f "$eigen_inc/Eigen/Dense" \
            || { echo "::error::no Eigen headers under $eigen_inc"; exit 1; }
          test -d "$boost_inc/boost" \
            || { echo "::error::no Boost headers under $boost_inc"; exit 1; }
          test -f /usr/local/include/wdm.hpp \
            || { echo "::error::no wdm headers under /usr/local/include"; exit 1; }
          cmake -S . -B build-dep-paths \
            -DCMAKE_BUILD_TYPE=Release \
            -DVINECOPULIB_PRECOMPILED=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DEIGEN3_INCLUDE_DIR="$eigen_inc" \
            -DBoost_INCLUDE_DIRS="$boost_inc" \
            -Dwdm_INCLUDE_DIRS=/usr/local/include
          link_txt=build-dep-paths/CMakeFiles/vinecopulib.dir/link.txt
          if [ ! -f "$link_txt" ]; then
            echo "::error::$link_txt was not generated; the check below is void"
            exit 1
          fi
          if grep -q -- '-lwdm' "$link_txt"; then
            echo "::error::wdm reached the link line as -lwdm; its target is missing"
            exit 1
          fi
        shell: bash
      # The translation runs at configure time, so these counts are final.
      - name: Configure from a source path containing regex metacharacters
        run: |
          src="$RUNNER_TEMP/vine+copu.lib"
          cp -a "$GITHUB_WORKSPACE" "$src"
          cmake -S "$src" -B "$src/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVINECOPULIB_PRECOMPILED=ON \
            -DBUILD_TESTING=OFF
          expected_hpp=$(find "$src/include/vinecopulib" -name '*.hpp' | wc -l)
          actual_hpp=$(find "$src/build/generated/include/vinecopulib" \
            -name '*.hpp' 2>/dev/null | wc -l)
          expected_cpp=$(find "$src/include" -name '*.ipp' | wc -l)
          actual_cpp=$(find "$src/build/generated/src" \
            -name '*.cpp' 2>/dev/null | wc -l)
          echo "headers $actual_hpp/$expected_hpp, sources $actual_cpp/$expected_cpp"
          if [ "$actual_hpp" -ne "$expected_hpp" ] \
             || [ "$actual_cpp" -ne "$expected_cpp" ]; then
            echo "::error::the generated tree is incomplete"
            exit 1
          fi
          # A leftover .ipp include gets the implementation compiled twice.
          if grep -rl '\.ipp>' "$src/build/generated/include"; then
            echo "::error::a generated header still includes its .ipp"
            exit 1
          fi
          # An untranslated destination path stays in the source tree.
          if [ -n "$(git -C "$src" status --porcelain -- include)" ]; then
            echo "::error::configure wrote into the source tree"
            exit 1
          fi
        shell: bash

  # VINECOPULIB_SANITIZERS cannot see a data race and cannot be combined
  # with -fsanitize=thread, so this needs a build tree of its own. clang,
  # because GCC's libtsan reports false races on
  # std::condition_variable::wait_for, which ThreadPool::wait() uses.
  thread-sanitizer:
    name: thread sanitizer (ubuntu, clang)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A report exits 66, which fails the step.
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # R, or the VinecopTest fixture skips every one of its tests.
      - name: Install dependencies
        id: install-dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu-latest
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          eigen_install_dir: ${{ runner.temp }}/eigen
          R: true
          lcov: false
      # find_package picks both up via CMP0074.
      - name: Set environment variables
        run: |
          echo "BOOST_ROOT=${{ steps.install-dependencies.outputs.BOOST_ROOT }}" >> $GITHUB_ENV
          echo "Eigen3_ROOT=${{ runner.temp }}/eigen" >> $GITHUB_ENV
      # RelWithDebInfo, because ThreadSanitizer multiplies an already slow
      # Debug suite; the <area>_only targets build three areas, not fourteen.
      - name: Configure and build with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan -j"$(nproc)" --target \
            test_tools_thread_only test_bicop_select_only test_vinecop_class_only
        shell: bash
      # setarch -R, or TSan aborts when vm.mmap_rnd_bits exceeds what its
      # shadow mapping supports; unlike the sysctl it needs no privileges.
      - name: Run the thread-pool tests under ThreadSanitizer
        run: |
          arch=$(uname -m)
          setarch "$arch" -R build-tsan/bin/test_tools_thread_only
          setarch "$arch" -R build-tsan/bin/test_bicop_select_only
          # Only the fits that ask for more than one thread use the pool.
          setarch "$arch" -R build-tsan/bin/test_vinecop_class_only \
            --gtest_filter='VinecopFit.parallel_fit_matches_serial:VinecopTest.works_multi_threaded:VinecopTest.tree_criterion_*:VinecopTest.inverse_rosenblatt_is_safe_for_concurrent_calls' \
            | tee tsan-vinecop.log
          # A filter that matches nothing exits 0.
          grep -qE '^\[  PASSED  \] [1-9][0-9]* test' tsan-vinecop.log
        shell: bash

  # Keeps the benchmark and parity targets compiling. The self-comparison
  # checks that every group is populated and that the gates file parses.
  benchmarks:
    name: benchmarks and parity harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        id: install-dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu-latest
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          R: false
      - name: Set environment variables
        run: |
          echo "BOOST_ROOT=${{ steps.install-dependencies.outputs.BOOST_ROOT }}" >> $GITHUB_ENV
      - name: Build bench_all and parity_dump
        run: |
          mkdir build-bench && cd build-bench
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DVINECOPULIB_BUILD_BENCHMARKS=ON -DBUILD_TESTING=OFF
          make bench_all parity_dump
      - name: Smoke-run the benchmark suite
        run: build-bench/bin/bench_all --benchmark_min_time=1x --benchmark_filter='bicop/pdf'
      - name: Parity dump and self-comparison
        run: |
          mkdir -p bench_results
          build-bench/bin/parity_dump bench_results/parity.json
          cp bench_results/parity.json bench_results/parity_ref.json
          python3 scripts/compare_parity.py \
            bench_results/parity_ref.json bench_results/parity.json \
            --tol-config scripts/parity_gates.json
      - name: Upload the parity dump
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-dump
          path: bench_results/parity.json
          if-no-files-found: warn

  # Compiles and runs the documentation snippets, then builds the pages with
  # WARN_AS_ERROR so prose and code cannot drift apart.
  docs:
    name: doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen graphviz
      - name: Install dependencies
        id: install-dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu-latest
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          R: false
          lcov: false
      # BOOST_ROOT must be exported: find_package picks it up via CMP0074.
      - name: Set environment variables
        run: |
          echo "BOOST_ROOT=${{ steps.install-dependencies.outputs.BOOST_ROOT }}" >> $GITHUB_ENV
      - name: Configure
        run: |
          mkdir build-docs && cd build-docs
          cmake .. -DVINECOPULIB_BUILD_DOC=ON -DBUILD_TESTING=OFF
      - name: Compile and run the documentation snippets
        run: |
          cd build-docs
          make -j$(nproc) doc_snippets
          # Running them is what catches an example that compiles but throws.
          for snippet in docs/snippets/doc_snippet_*; do
            echo "--- $snippet"
            (cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/build-docs/$snippet")
          done
      - name: Build the documentation
        run: |
          cd build-docs
          make doc 2>&1 | tee doxygen.log
      - name: Summarize Doxygen warnings
        if: always()
        run: |
          count=$(grep -c -i 'warning' build-docs/doxygen.log || true)
          echo "Doxygen emitted $count warning line(s)."
          grep -i 'warning' build-docs/doxygen.log | head -50 || true
      - name: Upload the Doxygen log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-log
          path: build-docs/doxygen.log
          if-no-files-found: warn
      # The site is what docs.yml publishes on a tag, and m.css is stricter
      # than Doxygen: it aborts on constructs Doxygen only warns about. Build
      # it here so a tag cannot be the first time anyone finds out.
      - name: Build the site
        uses: ./.github/actions/build-site
        with:
          build_dir: build-docs
      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: build-docs/docs
          if-no-files-found: error

  # Diff-only, so the curated check list can be enforced as an error.
  clang-tidy:
    name: clang-tidy (diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          # doxygen: configuring with VINECOPULIB_BUILD_DOC=ON below requires it,
          # even though only the snippet targets are wanted here.
          sudo apt-get install --no-install-recommends -y clang-tidy-14 jq doxygen
      - name: Install dependencies
        id: install-dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu-latest
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          R: true
      - name: Set environment variables
        run: |
          echo "BOOST_ROOT=${{ steps.install-dependencies.outputs.BOOST_ROOT }}" >> $GITHUB_ENV
      - name: Configure to generate compile_commands.json
        run: |
          mkdir build-tidy && cd build-tidy
          # Benchmarks and the documentation snippets are off by default; enable
          # them so their translation units appear in compile_commands.json,
          # without which clang-tidy lints them using default flags.
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVINECOPULIB_BUILD_BENCHMARKS=ON -DVINECOPULIB_BUILD_DOC=ON
          # Drop FetchContent (googletest) translation units.
          jq '[.[] | select(.file | test("_deps/") | not)]' compile_commands.json > filtered.json
          mv filtered.json compile_commands.json
      # Only translation units: headers have no compile_commands.json entry, so
      # clang-tidy would lint them with default flags and report the resulting
      # clang-diagnostic-errors as findings. The repo-wide pass below covers
      # them, transitively and with the right flags.
      - name: Run clang-tidy on the diff
        run: |
          git diff -U0 "origin/${{ github.base_ref }}...HEAD" \
            -- '*.cpp' '*.cc' \
            ':(exclude)include/vinecopulib/misc/nlohmann_json.hpp' \
            ':(exclude)include/vinecopulib/misc/tools_stats_sobol.hpp' \
            | /usr/lib/llvm-14/share/clang/clang-tidy-diff.py \
                -p1 -path build-tidy -clang-tidy-binary clang-tidy-14 -use-color

      # Keeps the backlog at zero rather than only gating new code. Two
      # translation units suffice: one including <vinecopulib.hpp> reaches every
      # library header bar version.hpp, and one parametric-bicop unit reaches the
      # shared test fixtures. (test_all.cpp is just main() and covers nothing.)
      - name: Run clang-tidy over the whole library
        run: |
          clang-tidy-14 -p build-tidy --quiet \
            docs/snippets/vinecop.cpp test/src_test/test_bicop_parametric.cpp
