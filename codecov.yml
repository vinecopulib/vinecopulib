codecov:
  notify:
    require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        threshold: 0.5%
        base: auto
        target: auto
    patch:
      default:
        threshold: 0.5%
        base: auto
        target: auto

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: false

ignore:
  - "test/"
  - "benchmarks/"
  - "examples/"
  - "include/vinecopulib/misc/nlohmann_json.hpp"
  # Generated tables, not hand-written code: the Sobol direction numbers alone
  # are 3.4 MB, which distorts the line-coverage denominator.
  - "include/vinecopulib/misc/tools_stats_sobol.hpp"
  - "include/vinecopulib/misc/tools_stats_ghalton.hpp"
